name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-gui.txt pyinstaller==6.22.3
          npm ci
      - name: Build local Tailwind stylesheet
        run: npm run build:css
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build CLI and desktop launchers
        run: python build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: codex-repair-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: codex-repair-*
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *preview* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${flags[@]}"
